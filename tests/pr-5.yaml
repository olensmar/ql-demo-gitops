# Acceptance test for PR #5: Expose Prometheus metrics on dedicated port 9797.
# Expected values come from the PR body's "Intended behaviour", not from the manifests.
apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: ql-demo-pr-5
  labels:
    demo: quality-loop
    generated-by: test-author
    pr: "5"
spec:
  config:
    host:
      type: string
      default: podinfo.ql-demo-preview.svc.cluster.local
  content:
    files:
      - path: /data/acceptance.js
        content: |
          import http from 'k6/http';
          import { check } from 'k6';

          export const options = { vus: 1, iterations: 1, thresholds: { checks: ['rate==1'] } };

          // GET a URL and log what was observed: HTTP status, transport error (e.g. connection refused), body excerpt.
          function observe(url) {
            const res = http.get(url, { timeout: '5s' });
            const err = res.error ? ` error="${res.error}"` : '';
            console.log(`observed ${url}: HTTP ${res.status}${err} body=${(res.body || '').slice(0, 300)}`);
            return res;
          }

          export default function () {
            const host = __ENV.HOST;

            // Baseline / PR promise: app traffic is unchanged on port 9898.
            const info = observe(`http://${host}:9898/api/info`);
            check(info, {
              'app answers on port 9898': (r) => r.status === 200,
            });

            // PR promise: http://podinfo.<namespace>.svc.cluster.local:9797/metrics serves Prometheus metrics (HTTP 200).
            const metrics = observe(`http://${host}:9797/metrics`);
            check(metrics, {
              'metrics endpoint on port 9797 returns HTTP 200': (r) => r.status === 200,
              'metrics on port 9797 are in Prometheus format': (r) =>
                r.status === 200 && typeof r.body === 'string' && r.body.includes('go_goroutines'),
            });
          }
  steps:
    - name: Acceptance checks for PR #5
      workingDir: /data
      run:
        image: grafana/k6:1.1.0
        env:
          - name: HOST
            value: "{{ config.host }}"
        args: ["run", "acceptance.js"]
