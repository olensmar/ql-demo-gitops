# Template the test-author agent copies to tests/pr-<N>.yaml.
# Rules:
#   - metadata.name: ql-demo-pr-<N>
#   - Ports, paths and expected values come from the PR's stated intent (title/body), never copied
#     from the manifests or config keys.
#   - Go through the Service DNS name, like a real client, so Service/port mistakes are caught.
#   - Always log what was observed so a failure is diagnosable from the logs alone.
apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: ql-demo-pr-0
  labels:
    demo: quality-loop
    generated-by: test-author
    pr: "0"
spec:
  config:
    host:
      type: string
      default: podinfo.ql-demo-preview.svc.cluster.local
  content:
    files:
      - path: /data/acceptance.js
        content: |
          import http from 'k6/http';
          import { check } from 'k6';

          export const options = { vus: 1, iterations: 1, thresholds: { checks: ['rate==1'] } };

          // GET a URL and log what was observed: HTTP status, transport error (e.g. connection refused), body excerpt.
          function observe(url) {
            const res = http.get(url, { timeout: '5s' });
            const err = res.error ? ` error="${res.error}"` : '';
            console.log(`observed ${url}: HTTP ${res.status}${err} body=${(res.body || '').slice(0, 300)}`);
            return res;
          }

          export default function () {
            const host = __ENV.HOST;

            // Baseline: the app still answers on its main port.
            const info = observe(`http://${host}:9898/api/info`);
            check(info, { 'app answers on port 9898': (r) => r.status === 200 });

            // One check per behaviour the PR promises, named in plain language.
            const promised = observe(`http://${host}:<port from PR>/<path from PR>`);
            check(promised, {
              '<behaviour the PR promises>': (r) => r.status === 200 /* && <expected content> */,
            });
          }
  steps:
    - name: Acceptance checks for PR #0
      workingDir: /data
      run:
        image: grafana/k6:1.1.0
        env:
          - name: HOST
            value: "{{ config.host }}"
        args: ["run", "acceptance.js"]
