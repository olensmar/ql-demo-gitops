# Proves the podinfo behaviour the demo's seeded bug relies on, on this cluster:
# with --port-metrics=9797 Prometheus metrics are served on 9797, and nothing listens on 9779
# (the port the demo PR's Service wrongly targets), so that Service port refuses connections.
apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: ql-demo-selftest
  labels:
    demo: quality-loop
    type: selftest
spec:
  services:
    podinfo:
      image: ghcr.io/stefanprodan/podinfo:6.7.1
      command: ["./podinfo"]
      args: ["--port=9898", "--port-metrics=9797", "--level=info"]
      readinessProbe:
        httpGet:
          path: /readyz
          port: 9898
  content:
    files:
      - path: /data/selftest.js
        content: |
          import http from 'k6/http';
          import { check } from 'k6';

          export const options = { vus: 1, iterations: 1, thresholds: { checks: ['rate==1'] } };

          function observe(url) {
            const res = http.get(url, { timeout: '5s' });
            const err = res.error ? ` error="${res.error}"` : '';
            console.log(`${url} -> HTTP ${res.status}${err}`);
            return res;
          }

          export default function () {
            const metrics = observe(`${__ENV.BASE_URL}:9797/metrics`);
            const typo = observe(`${__ENV.BASE_URL}:9779/metrics`);
            check(metrics, {
              'metrics port 9797 serves Prometheus metrics': (r) => r.status === 200 && (r.body || '').includes('go_goroutines'),
            });
            check(typo, {
              'typo port 9779 refuses connections': (r) => r.status === 0,
            });
          }
  steps:
    - name: Verify podinfo metrics-port behaviour the demo relies on
      workingDir: /data
      run:
        image: grafana/k6:1.1.0
        env:
          - name: BASE_URL
            value: "http://{{ services.podinfo.0.ip }}"
        args: ["run", "selftest.js"]
